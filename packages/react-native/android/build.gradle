buildscript {
  ext.BrudcastReactNative = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }
    return BrudcastReactNative[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def brudcastPackage = new groovy.json.JsonSlurper().parse(file("../package.json"))
def brudcastSdkVersion = brudcastPackage.brudcast.nativeVersion

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

repositories {
  if (findProperty("brudcastMavenLocal") == "true") {
    mavenLocal()
  }
  google()
  mavenCentral()
}

android {
  namespace "com.brudcast.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests.all {
      it.useJUnitPlatform()
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  api "com.brudcast:sdk-core:${brudcastSdkVersion}"
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${getExtOrDefault('kotlinVersion')}"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}
